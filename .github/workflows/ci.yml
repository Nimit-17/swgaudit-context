name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  mintlify-check:
    name: Mintlify broken-link check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Plain site sanity (Mintlify removed)
        run: |
          set -euo pipefail
          test -f plain/index.php
          test -f plain/css/site.css
          test -f plain/js/nav.js
          test -f scripts/narrative-copy.json
          test -f scripts/sync-plain-copy.js
          if find . -name '*.mdx' -not -path './.git/*' | grep -q .; then
            echo 'Mintlify .mdx files must not be in the repo'
            find . -name '*.mdx' -not -path './.git/*'
            exit 1
          fi
          if [ -f docs.json ] || [ -f package.json ] || [ -f swg.js ] || [ -f style.css ]; then
            echo 'Mintlify root artifacts must not be in the repo'
            exit 1
          fi
          echo 'plain site layout ok'

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  plain-check:
    name: Plain site sanity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Require plain DocumentRoot files
        run: |
          set -euo pipefail
          test -f plain/index.php
          test -f plain/css/site.css
          test -f plain/js/nav.js
          test -f scripts/narrative-copy.json
          test -f scripts/sync-plain-copy.js
          # Mintlify must not return
          if compgen -G '*.mdx' > /dev/null || compgen -G '**/*.mdx' > /dev/null; then
            echo 'Mintlify .mdx files must not be in the repo'
            exit 1
          fi
          if [ -f docs.json ] || [ -f package.json ] || [ -f swg.js ] || [ -f style.css ]; then
            echo 'Mintlify root artifacts must not be in the repo'
            exit 1
          fi
          echo 'plain site layout ok'
